<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的视频播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .video-box {
            width: 90%;
            max-width: 900px;
        }
        video {
            width: 100%;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="video-box">
        <video src="test.mp4" controls></video>
    </div>
</body>
</html>
